name: Release mobile app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install web dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Package OTA bundle
        env:
          BUNDLE_VERSION: 1.0.${{ github.run_number }}
          OTA_PUBLIC_BASE: https://raw.githubusercontent.com/thatstej45/lifequest/gh-pages
        run: node scripts/package-ota.mjs

      - name: Publish live-update channel
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: mobile-release
          force_orphan: true

      - name: Sync Android project
        run: npx cap sync android

      - name: Assemble debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lifequest-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
